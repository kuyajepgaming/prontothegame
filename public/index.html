<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronto The Game — Create Session</title><style>body{font-family:system-ui;background:linear-gradient(145deg,#06132e,#173e85);color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.card{max-width:540px;background:#112454;border:1px solid #3a67b3;border-radius:24px;padding:38px;text-align:center}h1{font-size:38px}em{color:#ffd55c;font-style:normal}button{background:#ffd45e;border:0;padding:16px 28px;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}p{color:#c4d8fa}</style><div class="card"><h1>PRONTO <em>THE GAME</em></h1><p>Online Family Feud • Real-time player lobby</p><button id="create">Create Host Session</button><p id="status">A link for players and a private host control link will be generated.</p></div><script>document.getElementById('create').onclick=async()=>{const b=document.getElementById('create');b.disabled=true;try{const r=await fetch('/api/rooms',{method:'POST'});if(!r.ok)throw Error('Could not create room');const j=await r.json();location.href=j.hostUrl}catch(e){document.getElementById('status').textContent=e.message;b.disabled=false}}</script></html>
