<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Pronto The Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#05132f,#174488);color:white;font-family:system-ui,sans-serif;min-height:100vh}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:5}
.card{width:min(480px,94vw);padding:30px;background:#102754;border:1px solid #446aab;border-radius:20px;text-align:center;box-shadow:0 20px 60px #0007}
h1{font-size:34px}strong{color:#ffcf58}input{padding:14px;border-radius:9px;border:1px solid #779bd1;background:#102048;color:white;width:90%;font-size:18px}
button{margin-top:15px;padding:14px 22px;background:#ffcb57;color:#14264b;border:0;border-radius:9px;font-size:17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}p{color:#cad9f7}#error{color:#ffb1b1}
</style></head>
<body>
<iframe id="gameFrame" title="Pronto The Game - player board and buzzer" allow="autoplay; fullscreen"></iframe>
<div id="gate"><div class="card">
<h1>PRONTO <strong>THE GAME</strong></h1><p>Room <b id="code"></b></p>
<div id="entry"><p>Enter your name to join the game.</p><input id="name" placeholder="Your name" maxlength="55" autocomplete="name"><br><button id="join">Join Game</button></div>
<div id="ready" hidden><h2>You're in! 🎉</h2><p>The game board is ready. Enter to start the background music and use your buzzer.</p><button id="enterGame" disabled>Loading game…</button></div>
<p id="error" role="alert"></p>
</div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const code=location.pathname.split('/').pop().toUpperCase();
const storage='pronto-room-'+code;
const byId=x=>document.getElementById(x);
byId('code').textContent=code;
let id=localStorage.getItem(storage),name=localStorage.getItem(storage+'-name')||'';
byId('name').value=name;
const socket=io();
let frameReady=false,joining=false;
function showError(message){byId('error').textContent=message||''}
function prepareBoard(){
 byId('entry').hidden=true;
 byId('ready').hidden=false;
 frameReady=false;
 const frame=byId('gameFrame');
 frame.onload=()=>{frameReady=true;byId('enterGame').disabled=false;byId('enterGame').textContent='▶ Enter Game';};
 frame.src='/game?room='+encodeURIComponent(code)+'&view=player';
}
function join(){
 if(joining)return;
 name=byId('name').value.trim();
 if(name.length<2){showError('Please enter a name of at least 2 characters.');return}
 joining=true;byId('join').disabled=true;showError('');
 socket.emit('joinPlayer',{name,previousId:id},r=>{
  joining=false;byId('join').disabled=false;
  if(r?.error){showError(r.error);return}
  id=r.id;localStorage.setItem(storage,id);localStorage.setItem(storage+'-name',name);
  prepareBoard();
 });
}
socket.on('connect',()=>socket.emit('enter',{room:code,view:'participant',playerId:id},r=>{
 if(r?.error){showError(r.error);return}
 // Player deliberately clicks Enter Game, preserving the sound-unlock gesture.
}));
byId('join').onclick=join;
byId('name').onkeydown=e=>{if(e.key==='Enter')join()};
byId('enterGame').onclick=()=>{
 if(!frameReady)return;
 const frame=byId('gameFrame'),win=frame.contentWindow;
 // Invoked directly from a user's click, rather than an autoplay attempt.
 try{
  const doc=win.document;
  const play=doc.getElementById('musicPlay');
  if(play)play.click();
  else doc.getElementById('backgroundMusic')?.play().catch(()=>{});
 }catch(e){console.warn('Music initialization:',e)}
 frame.style.display='block';
 byId('gate').style.display='none';
};
</script></body></html>
