<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Pronto The Game</title><style>body{background:linear-gradient(135deg,#05132f,#174488);color:#fff;font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(480px,92vw);padding:30px;background:#102754;border:1px solid #446aab;border-radius:20px;text-align:center}h1{font-size:34px}strong{color:#ffcf58}input{padding:14px;border-radius:9px;border:1px solid #779bd1;background:#102048;color:white;width:90%;font-size:18px;box-sizing:border-box}button{margin-top:15px;padding:14px 22px;background:#ffcb57;color:#14264b;border:0;border-radius:9px;font-weight:800;cursor:pointer}p{color:#cad9f7}.entry{background:#182f60;padding:10px;border-radius:10px;margin:8px 0}a{color:#ffe28a}</style><div class="card"><h1>PRONTO <strong>THE GAME</strong></h1><p>Room <b id="code"></b></p><div id="entry"><p>Enter your name to join the player pool.</p><input id="name" placeholder="Your name" maxlength="55" autocomplete="name"><br><button id="join">Join Game</button></div><div id="waiting" hidden><h2>You're in! 🎉</h2><p id="status">Waiting for host to assign teams.</p><div id="other"></div><div id="buzzerBox" class="entry"><button id="buzz" disabled style="width:100%;font-size:28px;padding:24px;background:#c94450;color:white">BUZZER LOCKED</button><p id="buzzStatus">Waiting for the host to open buzzing.</p></div><p><a id="watch" target="_blank" rel="noopener">Open game display</a></p></div><p id="error" role="alert"></p></div><script src="/socket.io/socket.io.js"></script><script>
const code=location.pathname.split('/').pop().toUpperCase(),S=io();document.getElementById('code').textContent=code;document.getElementById('watch').href='/game?room='+code+'&view=player';const storage='pronto-room-'+code;let id=localStorage.getItem(storage),name=localStorage.getItem(storage+'-name')||'';document.getElementById('name').value=name;
function ackJoin(){if(!name)return;S.emit('joinPlayer',{name,previousId:id},r=>{if(r.error)return document.getElementById('error').textContent=r.error;id=r.id;localStorage.setItem(storage,id);localStorage.setItem(storage+'-name',name);window.location.replace('/game?room='+encodeURIComponent(code)+'&view=player')})}
S.on('connect',()=>S.emit('enter',{room:code,view:'participant',playerId:id},r=>{if(r.error)return document.getElementById('error').textContent=r.error;if(r.buzzer){buzzer=r.buzzer;renderBuzz()}if(id&&name)ackJoin();}));
document.getElementById('join').onclick=()=>{name=document.getElementById('name').value.trim();ackJoin()};document.getElementById('name').onkeydown=e=>{if(e.key==='Enter')document.getElementById('join').click()};
let buzzer={open:false,entries:[]};
const buzzBtn=document.getElementById('buzz'),buzzStatus=document.getElementById('buzzStatus');
function renderBuzz(){
 const mine=buzzer.entries.find(x=>x.id===id);
 buzzBtn.disabled=!buzzer.open||!!mine;
 buzzBtn.textContent=mine?'BUZZED #'+mine.rank:(buzzer.open?'🔴 BUZZ!':'BUZZER LOCKED');
 buzzBtn.style.opacity=buzzBtn.disabled?'.6':'1';
 buzzStatus.textContent=mine?(mine.rank===1?'You buzzed FIRST!':'You buzzed #'+mine.rank):buzzer.open?'Press the buzzer as quickly as you can!':'Waiting for the host to open buzzing.';
}
buzzBtn.onclick=()=>{buzzBtn.disabled=true;S.emit('buzz',{},r=>{if(r.error){buzzStatus.textContent=r.error;renderBuzz()}else buzzStatus.textContent='Buzz received!';})};
S.on('buzzerState',b=>{buzzer=b;renderBuzz()});
S.on('lobby',l=>{if(!id)return;const p=l.participants.find(p=>p.id===id);document.getElementById('status').textContent=!p?'You have been removed from the lobby.':p.team===null?'Waiting for the host to assign teams.':`You've been assigned to Team ${p.team+1}!`;document.getElementById('other').innerHTML=`<div class="entry">${l.participants.length} player(s) joined · ${l.hostOnline?'Host online':'Host disconnected'}</div>`});
</script></html>
